# Cloudflare Workers 部署（由 GitHub Actions 统一负责 bing-wallpaper-api 与 bing-wallpaper 两个项目）
# push 到 master 即自动部署；未配置 Secrets 时整体跳过，不影响其他流程。
#
# ── 最小权限 Token 申请步骤 ────────────────────────────────────────────
# 1. Cloudflare Dashboard → 右上角头像 → My Profile → API Tokens → Create Token → Create Custom Token
# 2. 权限仅添加一条：Account | Workers Scripts | Edit
#    （wrangler deploy 上传脚本与静态资产的最低要求；不要添加 Zone 或其他 Account 权限）
# 3. Account Resources：Include → 选择你的账号（限定单账号）；IP 过滤与 TTL 有效期可选
# 4. Continue to summary → Create Token，复制保存（仅显示一次）
# 5. Account ID：Dashboard 任意页面右侧栏 / Workers & Pages 概览右下角
# 6. GitHub 仓库 → Settings → Secrets and variables → Actions → New repository secret：
#      CLOUDFLARE_API_TOKEN  = 第 4 步的 Token
#      CLOUDFLARE_ACCOUNT_ID = 第 5 步的 Account ID
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过 Cloudflare 部署"
            exit 0
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout (bing-wallpaper-api)
        uses: actions/checkout@v4

      # ── 1. 部署 bing-wallpaper-api（API Worker + data 静态资产） ──
      - name: Deploy bing-wallpaper-api
        run: |
          if [ ! -f wrangler.toml ]; then
            echo "当前分支不存在 wrangler.toml，跳过 bing-wallpaper-api 部署"
            exit 0
          fi
          npx --yes wrangler@4 deploy

      # ── 2. 部署 bing-wallpaper（站点静态资源） ──
      - name: Checkout (bing-wallpaper)
        uses: actions/checkout@v4
        with:
          repository: flow2000/bing-wallpaper
          path: bing-wallpaper
          ref: master

      - name: Build bing-wallpaper
        working-directory: bing-wallpaper
        run: |
          npm ci
          NODE_OPTIONS=--openssl-legacy-provider npm run build

      - name: Deploy bing-wallpaper
        working-directory: bing-wallpaper
        run: |
          # 用无 [build] 的配置部署，避免 wrangler 重复执行构建（webpack 3 需 NODE_OPTIONS）
          cat > wrangler.deploy.toml <<'EOF'
          name = "bing-wallpaper"
          compatibility_date = "2024-09-01"
          [assets]
          directory = "dist"
          not_found_handling = "single-page-application"
          EOF
          npx --yes wrangler@4 deploy --config wrangler.deploy.toml
