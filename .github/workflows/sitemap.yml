permissions:
  contents: write
name: update-sitemap

# bimg.cc 站点 sitemap.xml 每日生成与搜索引擎收录提交。
# sitemap.xml 提交到本仓库 sitemap/sitemap.xml，站点仓库 bing-wallpaper
# 在构建时（prebuild 钩子）从 GitHub raw 拉取最新版本打包进 dist。
# 百度 token 通过仓库 Secret BAIDU_TOKEN 注入，未配置时自动跳过百度提交。

on:
  schedule:
    # 每天北京时间 01:30（所有分地区数据更新 00:02-00:50 完成之后）
    - cron: '30 1 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-sitemap

jobs:
  sitemap:
    runs-on: ubuntu-latest
    concurrency:
      group: bing-wallpaper-sitemap
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9.12

      - name: Install Requirements
        run: pip install requests

      - name: Generate sitemap.xml
        run: python sitemap/generate_sitemap.py

      - name: Commit sitemap.xml
        run: |
          git config --local user.email "1982989137@qq.com"
          git config --local user.name "flow2000"
          git add sitemap/sitemap.xml
          if git diff --staged --quiet; then
            echo 'no commit'
            exit 0
          fi
          # 分地区数据更新工作流可能同时推送 master：先暂存，与远端 rebase 对齐后再恢复
          git stash push -m "sitemap-tmp" -- sitemap/sitemap.xml
          git pull --rebase origin master
          git stash pop
          git add sitemap/sitemap.xml
          git commit -m "update sitemap.xml"

      - name: Push changes
        # 原生 git push 带退避重试：远端临时拒绝（如二次限流 commit_refs）时自动重试
        run: |
          for i in 1 2 3; do
            git push origin master && exit 0
            echo "push failed, retry in $((i*30))s"
            sleep $((i*30))
            git pull --rebase origin master
          done
          exit 1

      - name: Submit to search engines
        if: always()
        continue-on-error: true
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        run: python sitemap/submit_seo.py
