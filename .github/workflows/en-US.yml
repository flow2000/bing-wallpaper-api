permissions:
  contents: write
name: 更新必应壁纸数据（美国 en-US）

on:
  schedule:
    # 每天美国太平洋时间 00:50（Bing 每日壁纸按太平洋时间刷新，故 en-US 取洛杉矶时区）
    # cron 按 timezone 指定的 IANA 时区解释，冬/夏令时自动切换；各地区分钟错峰，避免集中触发限流
    - cron: '50 0 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-en-US

env:
  STORAGE_TYPE: mongodb
  BING_MKT: en-US
  # mongodb配置
  MONGODB_URI: ${{ secrets.MONGODB_URI }}

jobs:
  build:
    runs-on: ubuntu-latest
    # 所有分地区任务共用同一并发组，串行推送 master，避免互相覆盖
    concurrency:
      group: bing-wallpaper-update
      cancel-in-progress: false
    steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Set up Python
       uses: actions/setup-python@v5
       with:
        cache: 'pip'
        python-version: 3.9.12

     - name: Install Requirements
       working-directory: ./bing_wallpaper_api
       run: |
         pip install --upgrade pip 'pip<24.1'
         pip install -r requirements.txt

     - name: mongodb Update bing
       if: ${{ env.STORAGE_TYPE == 'mongodb' }}
       env:
        BING_MKT: en-US
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
       working-directory: ./
       run: |
         python bing_wallpaper_api/run.py
         python bing_wallpaper_api/run_fix_last_day.py

     - name: Commit json Files
       run: |
         sh commit.sh ${BING_MKT}

     - name: Push changes
       # 原生 git push 带退避重试：远端临时拒绝（如二次限流 commit_refs）时自动重试
       run: |
         for i in 1 2 3; do
           git push origin master && exit 0
           echo "push failed, retry in $((i*30))s"
           sleep $((i*30))
           git pull --rebase origin master
         done
         exit 1

     - name: 生成站点地图并部署
       # 复用公共管线：生成 sitemap → 提交站点仓库 → SEO 收录提交 → Cloudflare 部署
       uses: ./.github/actions/post-update-pipeline
       with:
        region: en-US
        frontend_token: ${{ secrets.FRONTEND_REPO_TOKEN }}
        cf_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        cf_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        baidu_token: ${{ secrets.BAIDU_TOKEN }}
        indexnow_key: ${{ secrets.INDEXNOW_KEY }}
