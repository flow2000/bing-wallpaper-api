permissions:
  contents: write
name: update-bing-wallpaper-de-DE

on:
  schedule:
    # 每天柏林时间 00:20（cron 按 timezone 指定的 IANA 时区解释，冬/夏令时自动切换；各地区分钟错峰，避免集中触发限流）
    - cron: '20 0 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-de-DE

env:
  STORAGE_TYPE: mongodb
  BING_MKT: de-DE
  # mongodb配置
  MONGODB_URI: ${{ secrets.MONGODB_URI }}

jobs:
  build:
    runs-on: ubuntu-latest
    # 所有分地区任务共用同一并发组，串行推送 master，避免互相覆盖
    concurrency:
      group: bing-wallpaper-update
      cancel-in-progress: false
    steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Set up Python
       uses: actions/setup-python@v5
       with:
        cache: 'pip'
        python-version: 3.9.12

     - name: Install Requirements
       working-directory: ./bing_wallpaper_api
       run: |
         pip install --upgrade pip 'pip<24.1'
         pip install -r requirements.txt

     - name: mongodb Update bing
       if: ${{ env.STORAGE_TYPE == 'mongodb' }}
       env:
        BING_MKT: de-DE
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
       working-directory: ./
       run: |
         python bing_wallpaper_api/run.py
         python bing_wallpaper_api/run_fix_last_day.py

     - name: Commit json Files
       run: |
         sh commit.sh ${BING_MKT}

     - name: Push changes
       # 原生 git push 带退避重试：远端临时拒绝（如二次限流 commit_refs）时自动重试
       run: |
         for i in 1 2 3; do
           git push origin master && exit 0
           echo "push failed, retry in $((i*30))s"
           sleep $((i*30))
           git pull --rebase origin master
         done
         exit 1
