[build]
  # Netlify Functions 目录
  functions = "netlify/functions"
  # 发布目录（本项目为纯 API，无需静态站点）
  publish = "."

# 将数据文件和图标打包进函数，供 JS 函数读取本地 JSON 数据
[functions]
  included_files = ["data/*.json", "favicon.ico"]

# 将所有请求重写到 API 函数，实现根路径路由
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
