[build]
  # Netlify Functions 目录
  functions = "netlify/functions"
  # 发布目录（本项目为纯 API，无需静态站点）
  publish = "."

  [build.environment]
  PYTHON_VERSION = "3.12"

# 将数据文件和图标打包进函数，供 JS 函数读取本地 JSON 数据
[functions]
  included_files = ["data/*.json", "favicon.ico"]

# 将所有请求重写到 API 函数，实现根路径路由
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# CDN 缓存策略：按路径设置 Cache-Control 头（函数响应头优先，此处作为兜底）
# - /today、/all、/total、/：数据每日更新，缓存 1 小时
# - /favicon.ico：静态资源，缓存 1 年
# - /random：随机壁纸，禁止缓存
[[headers]]
  for = "/today"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=3600"

[[headers]]
  for = "/all"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=3600"

[[headers]]
  for = "/total"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=3600"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=3600"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/random"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
